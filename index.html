<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dead_sector</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- Interface fixe : elle ne bloque pas les clics destinés au jeu. -->
    <div class="hud" aria-hidden="true">
      <div id="damage-overlay"></div>
      <div class="crosshair" aria-hidden="true">
        <span class="crosshair-top"></span><span class="crosshair-right"></span>
        <span class="crosshair-bottom"></span><span class="crosshair-left"></span>
      </div>
      <div class="weapon-view" aria-hidden="true">
        <!-- Pistolet 9mm -->
        <div id="pistol-rig" class="weapon-group">
          <div class="weapon-hip">
            <div class="muzzle-flash"></div>
            <div id="weapon-hip-sprite" class="weapon-rig">
              <div class="reload-magazine"></div>
              <div class="reload-hand"></div>
              <div class="weapon-receiver"></div>
              <div class="weapon-body"></div>
              <div class="weapon-slide"></div>
            </div>
          </div>
          <div class="weapon-ads">
            <div class="muzzle-flash"></div>
            <div class="weapon-rig">
              <div class="weapon-receiver"></div>
              <div class="weapon-body"></div>
              <div class="weapon-slide"></div>
            </div>
          </div>
        </div>

        <!-- Fusil à pompe Calibre 12 -->
        <div id="shotgun-rig" class="weapon-group" hidden>
          <div class="shotgun-hip">
            <div class="shotgun-flash muzzle-flash"></div>
            <div id="shotgun-hip-sprite" class="shotgun-sprite"></div>
            <div class="shotgun-load-rig" aria-hidden="true">
              <div class="shotgun-load-body"></div>
              <div class="shotgun-load-gate"></div>
              <div class="shotgun-load-shell"></div>
              <div class="shotgun-load-hand"></div>
            </div>
          </div>
          <div class="shotgun-ads">
            <div class="shotgun-flash muzzle-flash"></div>
            <div id="shotgun-ads-sprite" class="shotgun-sprite"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="objective" class="objective" aria-live="polite">PALIER 1 · 3 MENACES</div>
    <div id="health" class="health" aria-live="polite">VIE : 100</div>
    <div id="flashlight-status" class="flashlight-status" aria-live="polite">[F] LAMPE : ALLUMÉE</div>
    <div id="ammo" class="ammo" aria-live="polite">CHARGEUR : 10 / 15 · RÉSERVE : 30</div>
    <div id="prompt" class="prompt" hidden>[E] OUVRIR LA PORTE</div>
    <div id="pause-message" class="message">Cliquez pour jouer · Clic droit : viser · [F] Lampe · [E] Ouvrir · Échap : pause</div>
    <div id="game-over" class="message game-over" role="alert" hidden>VOUS ÊTES MORT<br><button class="restart-button" type="button">Recommencer une tentative</button></div>
    <div id="victory" class="message game-over victory" role="status" hidden>MANOIR PURGÉ<br><small>Survie réussie · Les 3 paliers ont été éliminés</small><button class="restart-button" type="button">Recommencer une tentative</button></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
